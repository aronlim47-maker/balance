name: Balance checks
on:
  pull_request:
  push:
    branches: [master, LZH]
permissions:
  contents: read
concurrency:
  group: balance-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: SQL syntax only (not a database/RLS execution test)
        run: |
          python3 -m pip install --target .dart_tool/sql-audit pglast==8.4
          python3 tools/validate_sql.py supabase/migrations/*.sql supabase/tests/*.sql
